service {
  vgroup_mapping.order_service_group = "localRgroup"
  vgroup_mapping.product_service_group = "localRgroup"
  vgroup_mapping.order_aggregation_service_group = "localRgroup"
  localRgroup.grouplist = "seata-server:8091"
  enableDegrade = false
  disable = false
}
client {
  rm {
    asyncCommitBufferLimit = 10000
    lock {
      retryInterval = 10
      retryTimes = 30
      retryPolicyBranchRollbackOnConflict = true
    }
    reportRetryCount = 5
    tableMetaCheckEnable = false
    reportSuccessEnable = false
  }
  tm {
    commitRetryCount = 5
    rollbackRetryCount = 5
  }
  undo {
    dataValidation = true
    logSerialization = "protostuff"
    logTable = "undo_log"
  }
  log {
    exceptionRate = 100
  }
}
