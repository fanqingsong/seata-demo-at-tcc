service {
  vgroup_mapping.order_service_group = "default"
  vgroup_mapping.product_service_group = "default"
  vgroup_mapping.order_aggregation_service_group = "default"
  default.grouplist = "seata-server:8091"
  disableGlobalTransaction = false
}

store {
  mode = "db"

  file {
    dir = "sessionStore"
  }

  db {
    datasource = "dbcp"
    db-type = "mysql"
    driver-class-name = "com.mysql.jdbc.Driver"
    url = "jdbc:mysql://mysql:3306/seata?useUnicode=true&characterEncoding=utf8&useSSL=false"
    user = "root"
    password = "123456"
  }
}
